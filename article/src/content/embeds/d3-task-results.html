<div class="d3-task-results"><p class="pending" role="status">Reference results could not be loaded. See the repository's verified trial records.</p></div>
<style>
  .d3-task-results { position: relative; color: var(--text-color); }
  .d3-task-results svg { display: block; width: 100%; overflow: visible; }
  .d3-task-results .grid { stroke: var(--grid-color, var(--border-color)); }
  .d3-task-results .axis-text { fill: var(--tick-color, var(--muted-color)); font: 11px sans-serif; }
  .d3-task-results .row-text { fill: var(--text-color); font: 12px sans-serif; }
  .d3-task-results .bar:focus { outline: 2px solid var(--text-color); outline-offset: 2px; }
  .d3-task-results .footer { display: flex; justify-content: space-between; align-items: start; flex-wrap: wrap; gap: 18px; margin-top: 12px; }
  .d3-task-results .legend-title, .d3-task-results label { display: block; font-size: 12px; font-weight: 700; margin-bottom: 6px; }
  .d3-task-results .legend-item { display: flex; align-items: center; gap: 6px; font-size: 12px; }
  .d3-task-results .swatch { display: inline-block; width: 14px; height: 14px; border: 1px solid var(--border-color); border-radius: 3px; }
  .d3-task-results select { max-width: 100%; padding: 8px; border: 1px solid var(--border-color); border-radius: 8px; background: var(--surface-bg); color: var(--text-color); font: inherit; font-size: 12px; }
  .d3-task-results select:focus-visible, .d3-task-results summary:focus-visible { outline: 2px solid var(--primary-color); outline-offset: 3px; }
  .d3-task-results .metric-summary { font-size: 14px; margin: 18px 0 12px; }
  .d3-task-results .pending { margin: 0; font-size: 14px; color: var(--muted-color); }
  .d3-task-results .d3-tooltip { position: absolute; pointer-events: none; padding: 8px 10px; border: 1px solid var(--border-color); border-radius: 8px; background: var(--surface-bg); color: var(--text-color); font-size: 12px; max-width: 220px; z-index: 5; }
  .d3-task-results summary { cursor: pointer; font-size: 13px; }
  .d3-task-results .table-wrap { overflow-x: auto; }
  .d3-task-results table { width: 100%; border-collapse: collapse; font-size: 12px; }
  .d3-task-results th, .d3-task-results td { padding: 7px 5px; border-bottom: 1px solid var(--border-color); text-align: right; white-space: nowrap; }
  .d3-task-results th:first-child, .d3-task-results td:first-child { text-align: left; }
  .d3-task-results pre { color: var(--danger-color); white-space: pre-wrap; }
  @media print { .d3-task-results .controls, .d3-task-results .d3-tooltip { display: none; } }
</style>
<script>
(() => {
  const roots = Array.from(document.querySelectorAll('.d3-task-results')).filter(el => el.dataset.mounted !== 'true');
  const root = roots[roots.length - 1];
  if (!root) return;
  root.dataset.mounted = 'true';
  const mount = root.closest('[data-config]');
  const ns = 'http://www.w3.org/2000/svg';
  const percent = n => `${(100 * n).toFixed(1)}%`;
  const element = (tag, text, cls) => {
    const node = document.createElement(tag);
    if (text !== undefined) node.textContent = text;
    if (cls) node.className = cls;
    return node;
  };
  const svgNode = (tag, attrs, text) => {
    const node = document.createElementNS(ns, tag);
    for (const [name, value] of Object.entries(attrs)) node.setAttribute(name, value);
    if (text !== undefined) node.textContent = text;
    return node;
  };
  try {
    const data = JSON.parse(mount?.getAttribute('data-config') || '{}');
    if (data.complete !== true) return;
    const goals = [1, 1, 3, 3, 5, 7, 3, 4, 2, 2];
    const rows = [...data.tasks].sort((a, b) => a.task - b.task);
    if (data.checkpoint_updates !== 20000 || rows.length !== 10 || data.method !== 'FPP') throw Error('Expected the complete fixed 20K FPP export.');
    const checkRate = (rate, count, total) => Number.isFinite(rate) && Math.abs(rate - count / total) < 1e-10;
    rows.forEach((row, i) => {
      if (row.task !== i + 1 || row.trials !== 20 || row.subgoals_total !== 20 * goals[i] ||
          !Number.isInteger(row.successes) || row.successes < 0 || row.successes > 20 ||
          !Number.isInteger(row.subgoals_completed) || row.subgoals_completed < 0 || row.subgoals_completed > row.subgoals_total ||
          !checkRate(row.success_rate, row.successes, 20) || !checkRate(row.subgoal_completion, row.subgoals_completed, row.subgoals_total)) {
        throw Error('Per-task counts are incomplete or inconsistent.');
      }
    });
    const successes = rows.reduce((sum, row) => sum + row.successes, 0);
    const completed = rows.reduce((sum, row) => sum + row.subgoals_completed, 0);
    const taskMean = rows.reduce((sum, row) => sum + row.subgoal_completion, 0) / 10;
    const metrics = data.metrics;
    if (metrics.trials !== 200 || metrics.successes !== successes || metrics.subgoals_total !== 620 ||
        metrics.subgoals_completed !== completed || !checkRate(metrics.whole_task_success, successes, 200) ||
        !checkRate(metrics.pooled_subgoal_completion, completed, 620) ||
        !Number.isFinite(metrics.mean_subgoal_completion) || Math.abs(metrics.mean_subgoal_completion - taskMean) > 1e-10) {
      throw Error('Aggregate counts differ from the per-task export.');
    }
    root.replaceChildren();
    const chart = svgNode('svg', { role: 'img', 'aria-label': 'FPP results for ten LIBERO-Mem tasks. Raw counts are available below.' });
    root.append(chart);
    const color = window.ColorPalettes?.getColors('categorical', 1)?.[0] || 'var(--primary-color)';
    const footer = element('div', undefined, 'footer');
    const legend = element('div', undefined, 'legend');
    legend.append(element('div', 'Legend', 'legend-title'));
    const item = element('div', undefined, 'legend-item');
    const swatch = element('span', undefined, 'swatch');
    swatch.style.background = color;
    item.append(swatch, element('span', 'FPP'));
    legend.append(item);
    const controls = element('div', undefined, 'controls');
    const label = element('label', 'Metric');
    const select = element('select');
    select.id = `metric-${root.id || Math.random().toString(36).slice(2)}`;
    label.htmlFor = select.id;
    select.append(new Option('Whole-task success', 'success'), new Option('Subgoal completion', 'subgoal'));
    controls.append(label, select);
    footer.append(legend, controls);
    const summary = element('p', '', 'metric-summary');
    summary.setAttribute('aria-live', 'polite');
    const details = element('details');
    details.append(element('summary', 'Raw counts for each task'));
    const tableWrap = element('div', undefined, 'table-wrap');
    const table = element('table');
    const head = element('thead');
    const header = element('tr');
    ['Task', 'Success', 'Subgoals'].forEach(text => header.append(element('th', text)));
    head.append(header);
    const body = element('tbody');
    rows.forEach(row => {
      const tr = element('tr');
      tr.append(element('td', `T${row.task}`), element('td', `${row.successes}/${row.trials} (${percent(row.success_rate)})`),
        element('td', `${row.subgoals_completed}/${row.subgoals_total} (${percent(row.subgoal_completion)})`));
      body.append(tr);
    });
    table.append(head, body);
    tableWrap.append(table);
    details.append(tableWrap);
    const tooltip = element('div', '', 'd3-tooltip');
    tooltip.hidden = true;
    root.append(footer, summary, details, tooltip);
    const hideTip = () => { tooltip.hidden = true; };
    const render = () => {
      hideTip();
      const width = Math.max(230, root.clientWidth);
      const left = 32, right = 54, top = 30, rowHeight = 32, height = 382;
      const plotWidth = width - left - right;
      const isSuccess = select.value === 'success';
      chart.setAttribute('viewBox', `0 0 ${width} ${height}`);
      chart.replaceChildren();
      [0, 0.25, 0.5, 0.75, 1].forEach(tick => {
        const x = left + tick * plotWidth;
        chart.append(svgNode('line', {x1: x, x2: x, y1: top - 9, y2: top + rows.length * rowHeight - 5, class: 'grid'}));
        chart.append(svgNode('text', {x, y: 13, 'text-anchor': 'middle', class: 'axis-text'}, percent(tick).replace('.0', '')));
      });
      rows.forEach((row, i) => {
        const y = top + i * rowHeight;
        const numerator = isSuccess ? row.successes : row.subgoals_completed;
        const denominator = isSuccess ? row.trials : row.subgoals_total;
        const description = `T${row.task}: ${numerator}/${denominator}, ${percent(numerator / denominator)}`;
        chart.append(svgNode('text', {x: 0, y: y + 16, class: 'row-text'}, `T${row.task}`));
        const bar = svgNode('rect', {x: left, y, width: Math.max(0, numerator / denominator * plotWidth), height: 23,
          fill: color, class: 'bar', tabindex: 0, 'aria-label': description});
        const showTip = () => {
          tooltip.textContent = description;
          tooltip.style.left = `${Math.min(left, Math.max(0, width - 220))}px`;
          tooltip.style.top = `${y + 25}px`;
          tooltip.hidden = false;
        };
        bar.addEventListener('pointerenter', showTip);
        bar.addEventListener('focus', showTip);
        bar.addEventListener('pointerleave', hideTip);
        bar.addEventListener('blur', hideTip);
        chart.append(bar, svgNode('text', {x: width - 1, y: y + 16, 'text-anchor': 'end', class: 'row-text'}, `${numerator}/${denominator}`));
      });
      chart.append(svgNode('text', {x: left + plotWidth / 2, y: height - 3, 'text-anchor': 'middle', class: 'axis-text'},
        isSuccess ? 'Whole-task success (%)' : 'Subgoal completion (%)'));
      summary.textContent = isSuccess
        ? `${successes}/200 successful trials (${percent(successes / 200)}).`
        : `Task mean: ${percent(taskMean)}. Pooled: ${completed}/620 subgoals (${percent(completed / 620)}).`;
    };
    select.addEventListener('change', render);
    render();
    if (window.ResizeObserver) new ResizeObserver(render).observe(root);
    else window.addEventListener('resize', render);
  } catch (error) {
    root.replaceChildren(element('pre', `Results unavailable: ${error.message}`));
  }
})();
</script>
