[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fpp-libero-mem"
version = "0.1.0"
description = "Simulation-only Full-History Patch Policy training and evaluation for LIBERO-Mem"
requires-python = ">=3.10"
dependencies = [
  "h5py>=3.9",
  "numpy>=1.24",
  "timm>=1.0",
  "torch>=2.5",
]

[tool.setuptools.packages.find]
include = ["fpp_libero_mem*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[project.optional-dependencies]
dev = ["pytest>=8"]
